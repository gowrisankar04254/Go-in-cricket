
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-In Cricket • Live Matches & Updates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e',
                            600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes soft-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .live-pulse { animation: soft-pulse 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-950 dark:text-gray-200 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <header class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800 transition-colors">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-sm">
                    <i data-lucide="trophy" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="text-[10px] font-semibold tracking-wider text-brand-600 dark:text-brand-500 uppercase block leading-none">
                        Go-Interactive Presents
                    </span>
                    <h1 class="text-lg font-bold tracking-tight text-gray-900 dark:text-white">
                        Go-In Cricket
                    </h1>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
                </button>
                <button id="refreshBtn" onclick="fetchScores()" class="flex items-center space-x-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition active:scale-95 shadow-sm">
                    <i data-lucide="rotate-cw" id="refreshIcon" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-4 py-6 flex-1">
        <div class="flex items-center space-x-2 border-b border-gray-200 dark:border-gray-800 pb-3 mb-5 overflow-x-auto no-scrollbar">
            <button onclick="setFilter('ALL')" id="tab-ALL" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white transition">All Matches</button>
            <button onclick="setFilter('LIVE')" id="tab-LIVE" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 transition">Live</button>
            <button onclick="setFilter('UPCOMING')" id="tab-UPCOMING" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 transition">Upcoming</button>
            <button onclick="setFilter('COMPLETED')" id="tab-COMPLETED" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 transition">Completed</button>
        </div>

        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 mb-4 px-1">
            <span id="matchCount" class="font-medium">Loading match feeds...</span>
            <span id="lastUpdated" class="italic">Updating...</span>
        </div>

        <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-5 animate-pulse space-y-4">
                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-1/3"></div>
                <div class="space-y-3">
                    <div class="h-5 bg-gray-200 dark:bg-gray-800 rounded w-full"></div>
                    <div class="h-5 bg-gray-200 dark:bg-gray-800 rounded w-full"></div>
                </div>
                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-1/2"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-gray-900/50 py-4 text-center text-xs text-gray-500">
        <p>Go-In Cricket • Go-Interactive</p>
    </footer>

    <script>
        let matchesData = [];
        let currentFilter = 'ALL';

        document.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            lucide.createIcons();
            fetchScores();
            setInterval(fetchScores, 15000);
        });

        function initializeTheme() {
            if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.remove('dark');
                updateThemeIcon(false);
            } else {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }

        async function fetchScores() {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            try {
                const response = await fetch('/api/score');
                const data = await response.json();

                if (data && data.matches) {
                    matchesData = data.matches;
                    renderMatches();
                    document.getElementById('lastUpdated').innerText = 'Updated: ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                } else {
                    showError('No live cricket matches found right now.');
                }
            } catch (error) {
                console.error('Error fetching scores:', error);
                showError('Could not load updates. Please check network.');
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white');
                btn.classList.add('bg-gray-200', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300');
            });
            const activeBtn = document.getElementById(`tab-${filter}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-200', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300');
                activeBtn.classList.add('bg-brand-600', 'text-white');
            }
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            const countLabel = document.getElementById('matchCount');

            let filtered = matchesData;
            if (currentFilter !== 'ALL') {
                filtered = matchesData.filter(m => (m.status || '').toUpperCase() === currentFilter);
            }

            countLabel.innerText = `Showing ${filtered.length} ${currentFilter.toLowerCase()} match(es)`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800">
                        <i data-lucide="radio" class="w-8 h-8 mx-auto text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-500">No ${currentFilter.toLowerCase()} matches currently available.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(match => createMatchCard(match)).join('');
            lucide.createIcons();
        }

        function createMatchCard(match) {
            const isLive = (match.status || '').toUpperCase() === 'LIVE';
            return `
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-5 hover:border-gray-300 transition flex flex-col justify-between shadow-sm">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 truncate max-w-[220px]">${match.series}</span>
                            ${isLive ? `
                                <span class="flex items-center space-x-1.5 bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-red-200 dark:border-red-900/50">
                                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 live-pulse"></span>
                                    <span>LIVE</span>
                                </span>
                            ` : `
                                <span class="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-[11px] font-medium px-2.5 py-0.5 rounded-full border">${match.status}</span>
                            `}
                        </div>
                        <div class="space-y-3 my-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs flex items-center justify-center border">${match.team1.substring(0, 3)}</div>
                                    <span class="font-semibold text-sm text-gray-900 dark:text-white">${match.team1}</span>
                                </div>
                                <span class="font-bold text-sm text-gray-900 dark:text-white">${match.score1}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs flex items-center justify-center border">${match.team2.substring(0, 3)}</div>
                                    <span class="font-semibold text-sm text-gray-900 dark:text-white">${match.team2}</span>
                                </div>
                                <span class="font-bold text-sm text-gray-900 dark:text-white">${match.score2}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 text-xs text-gray-600 dark:text-gray-400 flex items-center justify-between">
                        <span class="truncate font-medium text-brand-700 dark:text-brand-400">${match.info}</span>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('matchesContainer').innerHTML = `
                <div class="col-span-full py-10 text-center bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800">
                    <i data-lucide="alert-circle" class="w-8 h-8 mx-auto text-amber-500 mb-2"></i>
                    <p class="text-sm text-gray-600 dark:text-gray-300 mb-3">${message}</p>
                    <button onclick="fetchScores()" class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 py-1.5 px-4 rounded-lg border font-medium">Try Reloading</button>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
